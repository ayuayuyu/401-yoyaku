services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: Asia/Tokyo
    ports:
      - 55432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d app" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - private-net

  yoyaku:
    container_name: 401-yoyaku
    build:
      context: ./backend
      dockerfile: build/go/Dockerfile
    volumes:
      - ./backend/src:/go/src/app
    ports:
      - 8080:8080
    environment:
      PORT: 8080
      DATABASE_URL: postgres://user:password@db:5432/app?sslmode=disable&TimeZone=Asia%2FTokyo
      GOOGLE_CLIENT_ID: 65271644036-jon13e4j2sbds65dq3v1m680jcnq15ba.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      SECRET_KEY: secret-key
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CALENDAR_SYNC_ENABLED: "false"
      SLACK_NOTIFY_ENABLED: "${SLACK_NOTIFY_ENABLED:-false}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      # 初期管理者のメール (カンマ区切り)。該当ユーザはログイン時に admin へ自動昇格する。
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
    tty: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private-net

  frontend:
    container_name: 401-yoyaku-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - 3000:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    depends_on:
      yoyaku:
        condition: service_started
    networks:
      - private-net

volumes:
  db-data:

networks:
  private-net:
    driver: bridge
