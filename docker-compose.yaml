# 開発用 compose。環境変数はリポジトリ直下の .env に一本化している (雛形: .env.example)。
# compose は同ディレクトリの .env を自動で読み、${VAR} の展開と env_file の両方に使う。
# 本番は docker-compose.prod.yml を参照。

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      TZ: Asia/Tokyo
    ports:
      - 55432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-app}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - private-net

  yoyaku:
    container_name: 401-yoyaku
    build:
      context: ./backend
      dockerfile: build/go/Dockerfile
    volumes:
      - ./backend/src:/go/src/app
    ports:
      - 8080:8080
    # バックエンドは .env のほぼ全キーを使うのでファイルごと渡す。
    env_file:
      - .env
    environment:
      PORT: 8080
      # 本番と同じく POSTGRES_* から組み立てる (.env に手書きさせない)。
      DATABASE_URL: "postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-app}?sslmode=disable&TimeZone=Asia%2FTokyo"
    tty: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private-net

  frontend:
    container_name: 401-yoyaku-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - 3000:3000
    # フロントに必要なのは NEXT_PUBLIC_API_URL だけ。env_file でまとめて渡すと
    # OAuth シークレット等までブラウザ側のビルドに触れる場所へ入るため、明示的に絞る。
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    depends_on:
      yoyaku:
        condition: service_started
    networks:
      - private-net

volumes:
  db-data:

networks:
  private-net:
    driver: bridge
