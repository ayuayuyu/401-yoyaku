# 本番 (Proxmox VE の LXC コンテナ) 用 compose。
# self-hosted runner が GHCR からイメージを pull して起動する。
# 外部公開は Cloudflare Tunnel 経由。cloudflared はこの compose には含めず、
# LXC ホスト上の systemd サービスとして動かす (Service: http://localhost:80)。
#
# 必要な環境変数はコンテナ内の .env で与える (.env.prod.example 参照)。

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      TZ: Asia/Tokyo
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/ayuayuyu/401-yoyaku-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # DATABASE_URL は .env に手書きさせず、POSTGRES_* から組み立てる。
    # 手書きだと (1) POSTGRES_PASSWORD との不一致 (2) 長い1行の折り返し崩れ が起きやすく、
    # 実際に本番で「値が空のまま起動 → 0.5秒で log.Fatal」を招いた。
    # environment は env_file より優先されるため、.env に古い DATABASE_URL が残っていても
    # こちらが勝つ。パスワードに @ : / ? # を使うと URL が壊れるので英数字にすること。
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-app}?sslmode=disable&TimeZone=Asia%2FTokyo"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # 起動直後の数秒はまだ listen していない。ここが無いと最初の失敗が即カウントされる。
      start_period: 10s

  nginx:
    image: ghcr.io/ayuayuyu/401-yoyaku-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    # 外部公開は cloudflared 経由。cloudflared は compose ではなく LXC ホスト上の
    # systemd サービスとして動かし、Public hostname の Service に http://localhost:80
    # を指定してここへ流す。127.0.0.1 に束ねているので外部には直接開かない。
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg_data:
