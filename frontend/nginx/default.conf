# 本番 nginx: 静的フロント配信 + backend へのリバースプロキシ。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip (静的アセット向け)
    gzip on;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # API・認証・ヘルスチェックは backend へプロキシ (same-origin で Cookie/OAuth を安定化)。
    location ~ ^/(api|login|callback|health) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service Worker はキャッシュさせない。Cloudflare やブラウザに保持されると
    # sw.js の更新が端末に届かず、古いフロントが貼り付いたままになる。
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # PWA マニフェスト。.webmanifest は nginx 既定の mime.types に無く
    # application/octet-stream で配られてしまうため、型を明示する。
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 内容ハッシュ付きのビルド成果物なので長期キャッシュしてよい。
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next static export。拡張子なしURLは .html にフォールバックし、無ければ index.html。
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
