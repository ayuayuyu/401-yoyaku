<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4285f4" />
    <title>オフライン - 401予約管理システム</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #202124;
        background: linear-gradient(180deg, #f4f7fb 0%, #eef3f9 100%);
        text-align: center;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #4285f4;
        color: #fff;
        font-weight: 700;
        font-size: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 8px 0 0;
      }
      p {
        margin: 0;
        color: #5f6368;
        line-height: 1.6;
      }
      button {
        margin-top: 8px;
        padding: 10px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        background: #4285f4;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #3367d6;
      }
    </style>
  </head>
  <body>
    <div class="badge">401</div>
    <h1>オフラインです</h1>
    <p>
      インターネットに接続できませんでした。<br />
      接続を確認してから、もう一度お試しください。
    </p>
    <button onclick="location.reload()">再読み込み</button>
  </body>
</html>
