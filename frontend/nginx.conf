# 本番: nginx を単一オリジンの玄関にする。
#   /                        → next export の静的ファイル (out/)
#   /api/ /login /callback /health → backend(Go) へ proxy
# フロントと API を同一オリジンに集約することで CORS と Cookie(SameSite) 問題を回避する。

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # 静的フロント (next export)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ /404.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Google OAuth 導線 (backend のトップレベルルート)
    location = /login {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /callback {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ヘルスチェック
    location = /health {
        proxy_pass http://backend:8080;
    }
}
