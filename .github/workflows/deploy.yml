name: Deploy

# Build & Push Images の成功後に、LXC コンテナ内の self-hosted runner で
# 最新イメージを pull して起動し直す。
on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [main]

# 同時デプロイを防止する。
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Proxmox LXC
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # runner の作業ディレクトリは毎回 checkout し直され、gitignore された .env を
      # 持たない。LXC 内の永続パスから復元する。
      - name: Restore .env from persistent location
        run: |
          # runner は systemd 配下で動くため $HOME が空になることがある
          # (実際に "/.401-yoyaku.env が見つかりません" で失敗した)。
          # 置き場所は固定パスを正とし、旧 ~/.401-yoyaku.env は移行用に見るだけ。
          ENV_SOURCE="/etc/401-yoyaku/.env"
          LEGACY_SOURCE="${HOME:-/root}/.401-yoyaku.env"
          if [ ! -f "${ENV_SOURCE}" ] && [ -f "${LEGACY_SOURCE}" ]; then
            echo "::warning::${LEGACY_SOURCE} を使用しています。${ENV_SOURCE} へ移動してください。"
            ENV_SOURCE="${LEGACY_SOURCE}"
          fi
          if [ ! -f "${ENV_SOURCE}" ]; then
            echo "::error::/etc/401-yoyaku/.env が見つかりません。LXC 内で 'bash scripts/setup-container.sh' を実行し、値を設定してください。"
            exit 1
          fi
          cp "${ENV_SOURCE}" .env

          # docker compose の dotenv パーサは 1 行でも壊れていると行番号だけ出して
          # 全体を読めずに落ちる。原因行を値マスク付きで先に示す。
          BAD=$(grep -nvE '^[[:space:]]*($|#|(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=)' .env || true)
          if [ -n "${BAD}" ]; then
            echo "::error::${ENV_SOURCE} に docker compose が解釈できない行があります (KEY=VALUE / 空行 / # コメント のみ可):"
            echo "${BAD}" | sed 's/=.*/=<値は省略>/; s/^/    /'
            exit 1
          fi

      # 行の書式が正しいだけでは足りない。値が空、または雛形のダミーのままだと
      # コンテナは起動できてもアプリが起動直後に log.Fatal で落ちる (実際に発生した)。
      # デプロイの入口で、原因を名指しして止める。
      - name: Validate .env values
        run: |
          val() {
            sed -nE "s/^[[:space:]]*(export[[:space:]]+)?$1[[:space:]]*=[[:space:]]*//p" .env \
              | head -1 | sed -E 's/^"(.*)"$/\1/; s/^'"'"'(.*)'"'"'$/\1/'
          }

          ERR=0
          require() {
            local key="$1" placeholder="${2:-}" v
            v="$(val "$key")"
            if [ -z "$v" ]; then
              echo "::error::${key} が空です。/etc/401-yoyaku/.env に値を設定してください。"
              ERR=1
            elif [ -n "$placeholder" ] && [ "$v" = "$placeholder" ]; then
              echo "::error::${key} が雛形のダミー値のままです (.env.prod.example から未編集)。"
              ERR=1
            fi
          }

          require POSTGRES_DB
          require POSTGRES_USER
          require POSTGRES_PASSWORD     change-me-strong-password
          require SECRET_KEY            change-me-session-signing-key
          require GOOGLE_CLIENT_ID      xxxxxxxxxxxx.apps.googleusercontent.com
          require GOOGLE_CLIENT_SECRET  xxxxxxxxxxxx
          require GOOGLE_REDIRECT_URL
          require FRONTEND_URL

          if [ "$(val SLACK_NOTIFY_ENABLED)" = "true" ]; then
            require SLACK_WEBHOOK_URL https://hooks.slack.com/services/xxx/yyy/zzz
          fi

          # compose は POSTGRES_* から DATABASE_URL を組み立てる。URL の予約文字が
          # パスワードに入ると DSN が壊れて "failed to connect database" になる。
          PW="$(val POSTGRES_PASSWORD)"
          if [ -n "$PW" ] && ! printf '%s' "$PW" | grep -qE '^[A-Za-z0-9._~-]+$'; then
            echo "::error::POSTGRES_PASSWORD に使えるのは英数字と . _ ~ - のみです。"
            echo "::error::@ : / ? # 空白 引用符 などが入ると DATABASE_URL の DSN が壊れます。"
            ERR=1
          fi

          if [ "$ERR" -ne 0 ]; then
            # 「ファイルには書いてあるのに全部空」という状況は、貼り付けで改行が
            # 失われて全体が1行に潰れているときに起きる。1行目が # で始まると
            # 書式チェックはコメント扱いで通ってしまい、原因が見えないまま
            # 「値が空」だけが延々と出る。構造を出して一発で分かるようにする。
            LINES=$(wc -l < .env | tr -d ' ')
            BYTES=$(wc -c < .env | tr -d ' ')
            KEYS=$(grep -cE '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=' .env || true)

            echo "::group::.env の構造 (値は表示しません)"
            echo "  行数: ${LINES} / バイト数: ${BYTES} / 認識できたキー: ${KEYS}"
            echo "  キー一覧:"
            grep -oE '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=' .env \
              | tr -d ' =' | sed 's/^/    /' || echo "    (なし)"
            echo "::endgroup::"

            if [ "${KEYS}" -eq 0 ] && [ "${BYTES}" -gt 200 ]; then
              echo "::error::.env に KEY=VALUE の行が1つもありません (${BYTES} バイトあるのに ${LINES} 行)。"
              echo "::error::改行が失われて全体が1行に潰れている可能性が高いです。端末への貼り付けが原因になりがちです。"
              echo "::error::対処: LXC 内で 'cd ~/401-yoyaku && git pull && install -m 600 .env.prod.example /etc/401-yoyaku/.env' してから値を編集してください。"
            fi
            exit 1
          fi
          echo "必須の環境変数はすべて設定されています。"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and restart services
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      # サービスごとに state と health を個別に見る。
      # `ps --format json` を grep する方式だと、起動に失敗して exited になった
      # コンテナが "unhealthy|starting" に一致せず「全部 up」と誤判定される。
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          SERVICES=$(docker compose -f docker-compose.prod.yml config --services)

          # 起動直後に落ちて再起動を繰り返すコンテナは、再起動の合間の一瞬を拾うと
          # running に見えてしまい「全部 up」と誤判定される (cloudflared で実際に発生)。
          # 待機開始時点の RestartCount を基準に、待っている間の増加を検知する。
          declare -A BASE_RESTARTS
          for svc in ${SERVICES}; do
            CID=$(docker compose -f docker-compose.prod.yml ps -q "${svc}" 2>/dev/null || true)
            if [ -n "${CID}" ]; then
              BASE_RESTARTS[$svc]=$(docker inspect -f '{{.RestartCount}}' "${CID}")
            else
              BASE_RESTARTS[$svc]=0
            fi
          done

          for i in $(seq 1 30); do
            PENDING=""
            FAILED=""
            for svc in ${SERVICES}; do
              CID=$(docker compose -f docker-compose.prod.yml ps -q "${svc}" 2>/dev/null || true)
              if [ -z "${CID}" ]; then
                FAILED="${FAILED} ${svc}(no-container)"
                continue
              fi
              STATE=$(docker inspect -f '{{.State.Status}}' "${CID}")
              HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${CID}")

              RESTARTS=$(docker inspect -f '{{.RestartCount}}' "${CID}")
              if [ "$((RESTARTS - ${BASE_RESTARTS[$svc]:-0}))" -ge 2 ]; then
                FAILED="${FAILED} ${svc}(再起動ループ)"
                continue
              fi

              case "${STATE}" in
                running)
                  case "${HEALTH}" in
                    healthy|none) ;;
                    starting)     PENDING="${PENDING} ${svc}" ;;
                    *)            FAILED="${FAILED} ${svc}(unhealthy)" ;;
                  esac
                  ;;
                created|restarting) PENDING="${PENDING} ${svc}" ;;
                *)                  FAILED="${FAILED} ${svc}(${STATE})" ;;
              esac
            done

            if [ -n "${FAILED}" ]; then
              echo "::error::起動に失敗したサービスがあります:${FAILED}"
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi
            if [ -z "${PENDING}" ]; then
              echo "All services are up."
              exit 0
            fi
            echo "  attempt $i/30: waiting for${PENDING}"
            sleep 5
          done
          echo "::error::Services did not become healthy within 150 seconds"
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --tail=50
          exit 1

      # nginx にはヘルスチェックが無いため、ここで nginx→backend の経路を実際に叩く。
      # プロキシ設定の破損はこのステップでしか検知できないので警告で流さず落とす。
      - name: Verify deployment
        run: |
          docker compose -f docker-compose.prod.yml ps
          echo ""
          echo "Health check via nginx..."
          for i in $(seq 1 12); do
            if curl -sf http://localhost/health; then
              echo ""
              echo "  backend is responding via nginx."
              exit 0
            fi
            echo "  attempt $i/12: not ready yet..."
            sleep 5
          done
          echo "::error::nginx 経由の /health が 60 秒以内に応答しませんでした"
          docker compose -f docker-compose.prod.yml logs --tail=50 nginx backend
          exit 1

      - name: Remove old Docker images
        if: always()
        run: docker image prune -f
