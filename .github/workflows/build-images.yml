name: Build & Push Images

# main への push で、テスト(ci.yml 再利用)通過後に本番イメージを GHCR へ push する。
# 実デプロイは deploy.yml が workflow_run でこのワークフロー成功を受けて実行する。
on:
  push:
    branches: [main]

concurrency:
  group: build-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ayuayuyu/401-backend
  NGINX_IMAGE: ghcr.io/ayuayuyu/401-nginx

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: CI (must pass before build)
    uses: ./.github/workflows/ci.yml

  build-backend:
    name: Build Backend Image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend/src
          file: ./backend/build/go/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-nginx:
    name: Build Nginx (frontend) Image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          # 同一オリジン配信のため API URL は空(=相対パス)で焼き込む
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
